name: monitor-cron

# Vercel Hobby cron runs only daily; this pings the monitor endpoint every 5 min
# (GitHub's minimum; runs may be delayed a few minutes under load).
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger monitor
        run: |
          curl -fsS --max-time 60 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://shunkhlai-fuel-monitor.vercel.app/api/cron/monitor
